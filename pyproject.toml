[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitness-analysis"
version = "0.1.0"
description = "Analysis tools for fitness activity data from Strava and MyNetDiary."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tabish Mustufa", email = "tabishm@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "openpyxl",
    "pandas",
    "pwlf",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "timezonefinder",
    "utm",
    "shapely",
    "activity-parser",
    "ruptures",
    "sqlite-utils",
    "geopy",
    "xlrd",
]

[tool.uv.sources]
activity-parser = { workspace = true }

[dependency-groups]
dev = ["garmin-fit-sdk", "pandas-stubs", "pre-commit", "pyright", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PL", "UP"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0913"]

[tool.pyright]
useLibraryCodeForTypes = false
